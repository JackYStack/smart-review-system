events {}

http {
  upstream review_api {
    server api:8002;
  }

  server {
    listen 80;

    location /api/ {
      proxy_pass http://review_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
      proxy_pass http://review_api;
    }
  }
}
