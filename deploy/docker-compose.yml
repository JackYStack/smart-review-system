services:
  api:
    build:
      context: ../backend
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
      MILVUS_HOST: ${MILVUS_HOST}
      VLLM_BASE_URL: ${VLLM_BASE_URL}
    ports:
      - "8002:8002"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
