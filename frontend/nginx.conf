map $http_x_forwarded_proto $smartreview_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

resolver 127.0.0.11 valid=10s ipv6=off;

upstream smartreview_backend {
    zone smartreview_backend 64k;
    server backend:8000 resolve;
}

upstream smartreview_onlyoffice {
    zone smartreview_onlyoffice 64k;
    server onlyoffice:80 resolve;
}

upstream smartreview_minio {
    zone smartreview_minio 64k;
    server minio:9000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://smartreview_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $smartreview_forwarded_proto;
        proxy_read_timeout 300s;
    }

    # OnlyOffice is exposed through the same gateway instead of a public 9080.
    location ^~ /office/ {
        proxy_pass http://smartreview_onlyoffice/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $smartreview_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /office;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_redirect ~^(/.*)$ /office$1;
    }

    # Presigned S3 paths start with the bucket name. Keeping the path unchanged
    # preserves the MinIO signature while hiding port 9000 from the network.
    location = /${MINIO_BUCKET} {
        proxy_pass http://smartreview_minio;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $smartreview_forwarded_proto;
    }
    location ^~ /${MINIO_BUCKET}/ {
        proxy_pass http://smartreview_minio;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $smartreview_forwarded_proto;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
