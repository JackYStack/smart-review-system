name: Build Images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          docker compose -f deploy/docker-compose.dev.yml config
          docker compose -f deploy/docker-compose.yml config
